[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Emi polls Telegram and runs a scheduler. Her only web pages are the sign-in
# callbacks for Google and Spotify (and /health), served on $PORT. Exactly one
# instance may run at a time; two would both poll Telegram and each would see
# only some of the messages.
[deploy]
numReplicas = 1
restartPolicyType = "ALWAYS"
